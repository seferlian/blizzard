name: Build and Release

on:
  push:
    tags:
      - 'v*' # Запускается только при пуше тега, начинающегося с v (например, v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Нужно для создания релиза и загрузки файлов

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java 17 (так как Gradle 8.5 требует Java 17+)
      # Для самого мода используется Java 8, но Gradle запускается на 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Даём права на выполнение gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Собираем мод (используем build, чтобы создался jar)
      - name: Build with Gradle
        run: ./gradlew build

      # 5. Создаём релиз на GitHub и загружаем туда jar-файл
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar # Берём все jar-файлы из папки build/libs
          generate_release_notes: true # GitHub сам сгенерирует описание изменений
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}